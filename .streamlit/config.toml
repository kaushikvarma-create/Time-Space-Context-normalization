# Look of the local Streamlit apps (dashboard, labelling tool). Plain and light; nothing here affects the data.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "minimal"
