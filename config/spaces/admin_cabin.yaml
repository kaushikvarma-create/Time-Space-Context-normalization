# Space config: admin cabin (small room, a few people).
space_id: admin_cabin
name: Admin cabin
space_type: room
camera:
  channel: 5
  subtype: 0            # 0 = main stream, 1 = sub stream
  # Host/user/password come from env (SBI_NVR_HOST, SBI_NVR_PORT, SBI_NVR_USER, SBI_NVR_PASS). Never put them here.
tz: Asia/Kolkata
cadence_minutes: 15

# Object types a human counts when labelling ground truth (kept short so labelling stays fast).
label_types: [person, chair, monitor, laptop, bag]

# Burned-in camera timestamp: blacked out before the VLM sees the image. Normalised [x1,y1,x2,y2].
mask_regions:
  - [0.64, 0.03, 0.97, 0.09]

# Position is geometric: the grid cell is computed from the detector's box.
# The VLM never sees the grid.
grid:
  cols: 8
  rows: 6
  anchor: bottom_center   # floor objects: use the box's bottom-centre (feet / wheels) for the cell

# Canonical vocabulary: the names counts are filed under. The VLM is NOT shown it (open-vocabulary prompt);
# its free-text labels are matched to these names and aliases, and anything else becomes a registry row flagged auto_new.
vocabulary:
  person:   {category: person,    mobility: dynamic}
  chair:    {category: furniture, mobility: semi_static}
  sofa:     {category: furniture, mobility: fixed}
  table:    {category: furniture, mobility: fixed}
  desk:     {category: furniture, mobility: fixed}
  laptop:   {category: device,    mobility: semi_static}
  monitor:  {category: device,    mobility: fixed}
  phone:    {category: device,    mobility: dynamic}
  bag:      {category: item,      mobility: dynamic}
  bottle:   {category: item,      mobility: dynamic}
  cup:      {category: item,      mobility: dynamic}
  book:     {category: item,      mobility: semi_static}
  plant:    {category: furniture, mobility: fixed}
  door:     {category: fixture,   mobility: fixed}
  whiteboard: {category: fixture, mobility: fixed}
  screen:   {category: device,    mobility: fixed}
  keyboard: {category: device,    mobility: semi_static}
  mouse:    {category: device,    mobility: semi_static}
  helmet:   {category: item,      mobility: dynamic}
  desktop_pc: {category: device,  mobility: fixed}

aliases:
  couch: sofa
  settee: sofa
  tv: monitor                # as in detector_map: the screens in this room are monitors
  television: monitor
  display: monitor
  computer: monitor
  notebook: laptop
  cell phone: phone
  mobile: phone
  mobile phone: phone
  backpack: bag
  handbag: bag
  potted plant: plant
  mug: cup
  worker: person
  man: person
  woman: person
  people: person
  water bottle: bottle
  computer tower: desktop_pc
  pc: desktop_pc
  cpu: desktop_pc
  tower: desktop_pc
  office chair: chair
  computer monitor: monitor
  motorcycle helmet: helmet

# Detector class -> canonical label (COCO names -> our vocabulary)
detector_map:
  person: person
  chair: chair
  couch: sofa
  "potted plant": plant
  "dining table": table
  laptop: laptop
  tv: monitor
  keyboard: keyboard
  mouse: mouse
  "cell phone": phone
  backpack: bag
  handbag: bag
  suitcase: bag              # the detector calls the large black bag on the desk a suitcase
  bottle: bottle
  cup: cup
  book: book

# Scene-level fields the VLM fills in
scene_fields:
  lighting: [daylight, artificial, dim, dark]
  door_state: [open, closed, unknown]
  tidiness: [tidy, ok, messy, unknown]

# Plain-English descriptions scored on every photo (SigLIP 2). Each concept is a few paraphrases that are averaged,
# so one wording does not decide the number. Add a concept or a prompt, then run `sbi score --space admin_cabin`
# to ask it of every stored photo. Concepts that mostly track occupancy or brightness (tidy, messy) are kept
# because they cost nothing, but check `sbi stability` before trusting them as separate signals.
probes:
  people:  ["a photo of an office with people working at desks", "several people sitting in an office", "a busy office with employees"]
  empty:   ["an empty office with nobody in it", "an office with no people", "a deserted office room"]
  lit:     ["a brightly lit office", "an office with the lights on", "a well lit room"]
  dark:    ["a dark room with the lights off", "a dimly lit office at night", "an office in darkness"]
  messy:   ["a messy cluttered desk with papers", "a disorganized desk with many items", "a desk covered in clutter"]
  tidy:    ["a clean tidy desk", "a neat organized desk", "an uncluttered tidy workspace"]
  meeting: ["a group of people having a meeting in an office", "people gathered around a table talking", "colleagues discussing together in a room"]
  computer_work: ["a person typing on a computer at a desk", "someone working on a laptop", "people looking at computer screens"]
  sitting:  ["people sitting on chairs in an office", "a person seated at a desk", "someone sitting down in a room"]
  standing: ["people standing in an office", "a person standing in a room", "someone walking across an office"]
  crowded:  ["a crowded office full of people", "many people packed in a small room", "a room with lots of people"]
  one_person: ["a single person alone in an office", "only one person in the room", "one person working by themselves"]
  screens_on: ["computer monitors switched on and glowing", "bright computer screens on desks", "monitors showing content"]
  screens_off: ["computer monitors switched off and black", "dark blank computer screens", "turned off monitors on desks"]
  sunlight: ["sunlight coming through a window into an office", "daylight in an office room", "natural light from windows"]
  door_open: ["an office with the door open", "an open doorway in a room", "a door standing open"]
  eating:   ["people eating food in an office", "someone having lunch at a desk", "food and drinks on an office table"]
  phone_call: ["a person talking on a mobile phone", "someone on a phone call", "a person holding a phone to their ear"]
  bags_on_desk: ["bags and backpacks on office desks", "a backpack placed on a chair", "handbags left on a table"]
  cleaning: ["a cleaner cleaning an office", "someone mopping the floor", "housekeeping staff tidying a room"]
  papers:   ["papers and documents spread on a desk", "stacks of files on a table", "paperwork on an office desk"]

# What `sbi forecast` predicts: table column names or wildcards, matched against the table's model-ready columns
# (so a new object type is picked up on its own). Threshold variants (count.yolo_c05.*) match only by exact name.
forecast_targets: ["scene.people_yolo", "scene.people_vlm", "count.yolo.*", "area.sam2.*", "probe.*"]
