# Space config: parking area (bikes and cars).
# Do NOT extract licence plates; counts and positions only.
space_id: parking
name: Parking area
space_type: parking
camera:
  channel: 3
  subtype: 0            # 0 = main stream, 1 = sub stream
  # Host/user/password come from env (SBI_NVR_HOST, SBI_NVR_PORT, SBI_NVR_USER, SBI_NVR_PASS). Never put them here.
tz: Asia/Kolkata
cadence_minutes: 15

# Object types a human counts when labelling ground truth (kept short so labelling stays fast).
label_types: [person, car, motorcycle]

# Burned-in camera timestamp: blacked out before the VLM sees the image. Normalised [x1,y1,x2,y2].
mask_regions:
  - [0.64, 0.03, 0.97, 0.09]

grid:
  cols: 12
  rows: 8
  anchor: bottom_center

vocabulary:
  car:        {category: vehicle, mobility: semi_static}
  bicycle:    {category: vehicle, mobility: semi_static}   # not 'bike': in Indian English 'bike' usually means motorbike
  motorcycle: {category: vehicle, mobility: semi_static}
  truck:      {category: vehicle, mobility: semi_static}
  bus:        {category: vehicle, mobility: dynamic}
  person:     {category: person,  mobility: dynamic}
  helmet:     {category: item,    mobility: dynamic}
  barrier:    {category: fixture, mobility: fixed}
  pole:       {category: fixture, mobility: fixed}
  gate:       {category: fixture, mobility: fixed}

aliases:
  cycle: bicycle
  pushbike: bicycle
  scooter: motorcycle
  motorbike: motorcycle
  automobile: car
  vehicle: car
  suv: car
  van: truck
  pedestrian: person

detector_map:
  car: car
  bicycle: bicycle
  motorcycle: motorcycle
  truck: truck
  bus: bus
  person: person

scene_fields:
  lighting: [daylight, artificial, dim, dark]
  weather_visible: [clear, cloudy, rain, fog, unknown]
  occupancy_level: [empty, sparse, moderate, full]

# Plain-English descriptions scored on every photo (SigLIP 2); see admin_cabin.yaml for how they are used.
probes:
  bikes:   ["a parking area full of motorcycles", "many motorbikes parked closely together", "a crowded two-wheeler parking lot"]
  empty:   ["an empty parking area", "a parking lot with no vehicles", "an empty concrete parking floor"]
  car:     ["a car parked in a parking area", "a parked car", "a sedan in a garage"]
  night:   ["a parking garage at night", "a dark parking area under artificial light", "a parking lot after dark"]
  day:     ["a parking area in bright daylight", "sunlight in a parking garage", "a parking lot during the day"]
  person:  ["people walking in a parking area", "a person standing near parked vehicles", "pedestrians in a parking lot"]
  full:     ["a completely full parking area", "every parking space taken by vehicles", "a packed parking lot with no free space"]
  half_full: ["a partly filled parking area", "a parking lot with some free spaces", "a few vehicles parked with gaps between"]
  arriving: ["a motorcycle being ridden into a parking area", "a person riding a scooter", "a vehicle entering a parking lot"]
  parking_bike: ["a person parking a motorbike", "someone pushing a scooter into a parking spot", "a rider getting off a motorcycle"]
  helmets:  ["helmets hanging on parked motorcycles", "a motorcycle helmet on a bike seat", "riders wearing helmets"]
  bicycles: ["bicycles parked in a row", "a pedal bicycle in a parking area", "push bikes parked together"]
  truck:    ["a truck or van in a parking area", "a delivery van parked", "a large vehicle in a parking lot"]
  wet:      ["a wet parking floor after rain", "rain falling on a parking area", "puddles on the ground"]
  shadows:  ["strong shadows cast by sunlight in a parking area", "bright sun and dark shadows on the ground", "sunny parking lot with shadows"]
  lights_on: ["parking area lit by electric lights", "lamps switched on in a parking garage", "artificial lighting in a parking lot"]
  group:    ["a group of people standing together in a parking area", "several people talking near motorcycles", "people gathered in a parking lot"]
  cleaning: ["someone sweeping a parking area", "a cleaner with a broom in a parking lot", "a person cleaning the floor"]
  disorder: ["motorcycles parked haphazardly in a mess", "vehicles parked in a disorderly way", "a cluttered parking area"]
  orderly:  ["motorcycles parked neatly in straight rows", "vehicles parked in an orderly line", "a well organised parking area"]

# Things that do not move. Counting them photo by photo gives mostly counting error (the detector saw 4 to 10 chairs
# in a room that has 7), so the table also gets steady.all.<type>: the middle value of the detector's and the VLM's
# counts over the last 24 hours. Read that for "how many chairs"; the raw counts stay as model inputs.
steady_types: [barrier, pole, gate]

# What `sbi forecast` predicts (see admin_cabin.yaml).
forecast_targets: ["scene.vehicles_yolo", "scene.people_yolo", "count.yolo.*", "count.vlm.motorcycle", "area.sam2.*", "probe.*"]
