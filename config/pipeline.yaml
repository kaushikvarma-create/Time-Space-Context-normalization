# Global pipeline settings. Per-space settings live in config/spaces/*.yaml.
# Secrets (NVR user/password) are never here: they come from .env / the environment.
# Env overrides: SBI_LMSTUDIO_URL, SBI_VLM_MODEL, SBI_NVR_HOST, SBI_NVR_PORT, SBI_NVR_USER, SBI_NVR_PASS
timezone: Asia/Kolkata          # IST. Used for logs and as the default for spaces

paths:                          # relative to the project root
  db: data/sbi.db
  images: data/images
  logs: data/logs
  cache: data/cache             # derived per-photo table columns; safe to delete, rebuilt when needed

frame_source:                   # kind: nvr_rtsp
  kind: nvr_rtsp
  rtsp_transport: tcp
  warmup_frames: 5              # buffered frames discarded so we keep the freshest one
  timeout_s: 10

detector:                       # kind: yolo
  kind: yolo
  weights: models/yolo26x.pt    # chosen by benchmark on 18 Nov 2026 (see PLAN.md): chairs exact in 80% of cabin photos
  imgsz: 1280                   # vs 31% for yolo12x at 1920. Larger sizes were worse here (1920: 59%), not better
  conf: 0.25                    # counting threshold: boxes at or above it are counted (observations, baselines)
  store_conf: 0.05              # storage floor: every box down to here is kept in `detections`, uncounted
  class_conf: {chair: 0.10, motorcycle: 0.10}   # per-label counting thresholds, set from labels and the known chair
                                # count (18 Nov 2026): with duplicate outlines removed, 0.10 beats 0.25 for both
  iou: 0.5
  dedupe_labels: [person]       # labels where a box mostly inside a stronger box is dropped
  dedupe_containment: 0.8
  dedupe_same_label_iou: 0.6    # same label, overlapping boxes (e.g. handbag+backpack -> bag)
  dedupe_outline_iou: 0.5       # counted boxes of one type whose OUTLINES overlap this much are one object: the weaker
                                # stops being counted (it stays stored). Needs the segmenter; 0 = off

segmenter:                      # outlines every stored detector box; kind: none switches it off
  kind: sam2
  weights: models/sam2.1_l.pt
  mask_width: 384               # stored outline resolution (384 x 216 for a 16:9 camera)
  batch: 64

embedder:                       # whole-scene image vector per photo; kind: none stops new vectors (old ones stay)
  kind: dinov2
  model: facebook/dinov2-base   # Hugging Face id or local path; loaded from the local cache when present
  width: 448                    # input width (multiple of 14); height follows the camera's aspect (448 x 252)

scorer:                         # rates every photo against the space's plain-English `probes`; kind: none stops new scores
  kind: siglip2
  model: google/siglip2-base-patch16-224   # Hugging Face id or local path; loaded from the local cache when present

forecast:                       # `sbi forecast` / `sbi backtest`
  model: amazon/chronos-2       # Hugging Face id; zero-shot (no training on our data)
  quantiles: [0.1, 0.5, 0.9]    # whole percents, must include 0.5 (the point forecast); stored as q10, q50, q90
  horizon: 16                   # slots ahead (16 x 15 min = 4 hours)
  min_context: 96               # slots of history required before forecasting (96 = 1 day)
  max_context: 8192             # newest slots of history used by live forecasts and the dashboard (Chronos-2 reads at
                                # most 8192, about 85 days)
  max_targets: 100              # cap on targets per space (what to forecast is `forecast_targets` in the space file)
  cross_learning: false         # let the model share information across targets in a batch (changes results)
  variant: all_profile          # inputs for live forecasts: the calendar, every model-ready extracted dimension, and for
                                # each forecast series what this kind of day looked like at each clock time so far
  every_minutes: 60             # the 15-minute tick also stores a forecast per space this often (0 = off)
  scheduled_model: chronos2     # forecaster used by the tick
  # variants: covariate sets (column kinds a model may see; cal = calendar, known in advance). Defaults:
  #   all_profile [all + day-type profiles] | all [cal + every model-ready column, uncapped] | profile | univariate [] | calendar [cal] | detector [cal + counts, areas, cells, relations, scene fields, image stats]
  #   | full [detector + emb + probe]

calendar:                       # known-in-advance day types: cal.is_holiday, cal.is_working_day
  country: IN                   # public holidays, only if the optional `holidays` package is installed
  subdivision: null             # state code for regional holidays (with the package)
  site_file: config/site_calendar.yaml   # the office's own holiday list and closures: fill this in
  working_days: [0, 1, 2, 3, 4] # Monday = 0; add 5 if the site works Saturdays

scene_reader:                   # kind: lmstudio_openai (any OpenAI-compatible vision endpoint)
  kind: lmstudio_openai
  base_url: http://10.20.0.1:1234
  model: qwen/qwen3.5-9b
  timeout_s: 120
  retries: 3
  max_tokens: 3000               # v3 answers (open vocabulary + relations) reach ~3k chars; 1200 truncated JSON
  temperature: 0.1
  reasoning_effort: none        # REQUIRED for Qwen3.5 on LM Studio: otherwise structured output comes back empty
  image_width: 1344

baseline:
  ewm_alpha: 0.3                # weight of the newest sample in the exponentially weighted mean

processing:
  backlog_limit: 5              # unprocessed frames retried per space per tick (e.g. after a detector outage)

curation:                       # vocabulary cleanup: synonyms ('same') and hierarchy ('is_a') links. See sbi/curation.
  embed_model: text-embedding-nomic-embed-text-v1.5   # shortlists candidate pairs (LM Studio, same base_url)
  judge_model: qwen/qwen3.5-9b  # answers "is every A a B?" in both directions
  min_similarity: 0.80          # embedding cosine to consider a pair at all
  auto_approve: true            # links are audited and reversible (sbi link-set ID rejected)

table:                          # the Chronos-ready table (sbi table)
  step_minutes: 15
  min_coverage: 0.5             # a column needs values in >= 50% of slots to be marked model-ready
  min_presence: 0.05            # a count must be > 0 in >= 5% of valid slots (drops one-off flickers)
  min_valid_slots: 8
  min_present_slots: 3          # seen in fewer slots = flicker, not a dimension (still kept in the table)
  exclude_labels: [wall, floor, ceiling, pillar, roof]   # building parts: their "counts" are VLM noise
  max_covariates: 24            # default number of past covariates handed to a model
  always_include: [scene.people_vlm, scene.people_yolo, scene.vehicles_yolo, count.vlm.motorcycle, count.yolo.car]
  min_autocorr: 0.3             # default inputs must change smoothly (real) rather than flicker (noise)
  autocorr_min_slots: 96        # ...but only once there is about a day of slots to estimate that reliably
  mask_dup_iou: 0.5             # same-type outlines overlapping this much are one object boxed twice
  cell_area_min: 0.02           # outline covering less than 2% of a grid cell is edge spill, recorded as 0
  embed_components: 4           # principal components of the image vectors: emb.<model>.pc1..pc4
  conf_levels: [0.05, 0.10]     # extra detector thresholds to count at: count.yolo_c05.<type>, count.yolo_c10.<type>
